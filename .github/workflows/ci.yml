name: CI

on: [push, pull_request]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v3
              with:
                enable-cache: true
            
            - name: Run Ruff Linter
              run: uv run ruff check .
            
            - name: Run Pytest
              run: uv run pytest